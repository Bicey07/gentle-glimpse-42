<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6f8374" />
    <title>Quiet Space · 暂时离线</title>
    <style>
      :root {
        color: #403b34;
        background: #f5f0e6;
        font-family: ui-serif, Georgia, "Noto Serif SC", serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      img {
        width: 92px;
        height: 92px;
        border-radius: 28px;
      }
      h1 {
        margin: 24px 0 10px;
        font-size: 24px;
        font-weight: 500;
      }
      p {
        margin: 0;
        color: #766f64;
        line-height: 1.8;
        font-size: 14px;
      }
      button {
        margin-top: 28px;
        border: 1px solid #6f8374;
        border-radius: 999px;
        background: transparent;
        color: #536558;
        padding: 11px 22px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/quiet-space.svg" alt="Quiet Space" />
      <h1>这里暂时很安静</h1>
      <p>网络恢复后，再回来看看房间里最近留下的痕迹。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
